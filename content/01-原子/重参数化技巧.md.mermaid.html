<!doctype html>
<html lang="zh"><head><meta charset="utf-8">
<title>重参数化技巧.md · Mermaid 缩放视图</title>
<style>
 body{font-family:-apple-system,system-ui,"PingFang SC",sans-serif;margin:0;background:#f5f5f7;color:#222}
 header{position:sticky;top:0;z-index:9;background:#fff;border-bottom:1px solid #ddd;padding:10px 16px;font-weight:600}
 .diagram{background:#fff;margin:16px;border:1px solid #ddd;border-radius:8px;overflow:hidden;scroll-margin-top:56px}
 .diagram h3{margin:0;padding:8px 12px;background:#fafafa;border-bottom:1px solid #eee;font-size:14px}
 .stage{height:80vh;width:100%}
 .stage svg{display:block;max-width:none!important}
</style></head><body>
<header>🔍 Mermaid 缩放视图 — 滚轮缩放 · 拖动平移 · 右下角按钮复位（来源:重参数化技巧.md）</header>
<div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.1/dist/svg-pan-zoom.min.js"></script>
<script>
const DIAGRAMS = [{"title": "原始形式（不可微分）", "code": "graph LR\n    s[\"状态 s\"] --> NN[\"神经网络(θ)\"]\n    NN --> params[\"(μ, σ)\"]\n    params -->|❌ 随机抽样| a[\"动作 a\"]\n    style a fill:#f66,stroke:#333,color:#fff"}, {"title": "重参数化形式（可微分）", "code": "graph LR\n    s[\"状态 s\"] --> NN[\"神经网络(θ)\"]\n    NN --> params[\"(μ, σ)\"]\n    eps[\"ε ~ N(0,1)\"] --> compute\n    params --> compute[\"μ + σ · ε\"]\n    compute --> a[\"动作 a\"]\n    style a fill:#6c6,stroke:#333,color:#fff\n    style compute fill:#6c6,stroke:#333,color:#fff"}];
const root = document.getElementById('root');
DIAGRAMS.forEach((d,idx)=>{
  const wrap=document.createElement('div'); wrap.className='diagram'; wrap.id='d'+(idx+1);
  const h=document.createElement('h3'); h.textContent=(idx+1)+'. '+d.title; wrap.appendChild(h);
  const stage=document.createElement('div'); stage.className='stage';
  const pre=document.createElement('pre'); pre.className='mermaid'; pre.textContent=d.code;
  stage.appendChild(pre); wrap.appendChild(stage); root.appendChild(wrap);
});
mermaid.initialize({startOnLoad:false, securityLevel:'loose', theme:'default'});
(async()=>{
  try{ await mermaid.run({querySelector:'.mermaid'}); }catch(e){ console.error(e); }
  document.querySelectorAll('.stage').forEach(stage=>{
    const svg = stage.querySelector('svg'); if(!svg) return;
    // 关键:用像素把 svg 撑满整个 stage(百分比会塌成图自然高→下方空白+裁剪)
    const sizeSvg=()=>{ const w=stage.clientWidth,h=stage.clientHeight;
      svg.setAttribute('width',w); svg.setAttribute('height',h);
      svg.style.width=w+'px'; svg.style.height=h+'px'; svg.style.maxWidth='none'; };
    sizeSvg();
    let pz;
    try{ pz=svgPanZoom(svg,{zoomEnabled:true,controlIconsEnabled:true,fit:true,center:true,
                            minZoom:0.1,maxZoom:40,mouseWheelZoomEnabled:true,contain:false}); }
    catch(e){ console.error('pan-zoom 失败',e); return; }
    const refit=()=>{ sizeSvg(); pz.resize(); pz.fit(); pz.center(); };
    requestAnimationFrame(()=>{ refit(); setTimeout(refit,200); });
    window.addEventListener('resize', refit);
    window.addEventListener('load', refit);
    // 自检:若没撑满(高度<99%),再补几次,极端图也不塌
    let tries=0; const guard=setInterval(()=>{ const r=svg.getBoundingClientRect();
      if(Math.abs(r.height-stage.clientHeight)<5 || ++tries>5){clearInterval(guard);} else refit(); },300);
  });
  if(location.hash){ const el=document.querySelector(location.hash); if(el) el.scrollIntoView(); }
})();
</script></body></html>
